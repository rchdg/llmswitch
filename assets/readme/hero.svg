<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">llmswitch</title>
  <desc id="desc">一套命令行工具，在 Claude Code、Codex 和 OpenCode 之间切换供应商与模型，并按需通过本地 bridge 转换 API 协议。</desc>

  <defs>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee6c4"/>
      <stop offset="1" stop-color="#64b5f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="28" fill="#0b1116"/>
  <path d="M0 318H1200" stroke="#24313a"/>
  <path d="M704 0V400" stroke="#1d2931"/>

  <g transform="translate(62 52)">
    <text x="0" y="0" fill="#7f929e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">MULTI-PROVIDER CLI</text>
    <text x="0" y="82" fill="#f4f1e8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="68" font-weight="750">llmswitch</text>
    <text x="0" y="132" fill="#bec9ce" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="27">一套命令，切换三种 AI 编程工具的供应商与模型</text>

    <g transform="translate(0 188)">
      <rect width="556" height="58" rx="12" fill="#121c23" stroke="#30414c"/>
      <text x="22" y="37" fill="#5ee6c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">$ llms launch codex gpt-4.1</text>
      <rect x="520" y="20" width="12" height="22" rx="2" fill="#5ee6c4"/>
    </g>
  </g>

  <g transform="translate(752 45)">
    <g transform="translate(0 118)">
      <rect width="130" height="72" rx="16" fill="#14231f" stroke="#3aa98e"/>
      <text x="65" y="31" text-anchor="middle" fill="#5ee6c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700">llms</text>
      <text x="65" y="53" text-anchor="middle" fill="#83969f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">profile</text>
    </g>

    <path d="M130 154H184V44H220" fill="none" stroke="url(#route)" stroke-width="3"/>
    <path d="M130 154H220" fill="none" stroke="url(#route)" stroke-width="3"/>
    <path d="M130 154H184V264H220" fill="none" stroke="url(#route)" stroke-width="3"/>

    <circle cx="184" cy="44" r="5" fill="#5ee6c4"/>
    <circle cx="184" cy="154" r="5" fill="#5ee6c4"/>
    <circle cx="184" cy="264" r="5" fill="#5ee6c4"/>

    <g transform="translate(220 4)">
      <rect width="196" height="80" rx="16" fill="#121c23" stroke="#30414c"/>
      <circle cx="24" cy="24" r="7" fill="#f6a85f"/>
      <text x="43" y="30" fill="#f4f1e8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="650">Claude Code</text>
      <text x="22" y="58" fill="#8ea1ab" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Messages ↔ Chat</text>
    </g>

    <g transform="translate(220 114)">
      <rect width="196" height="80" rx="16" fill="#121c23" stroke="#30414c"/>
      <circle cx="24" cy="24" r="7" fill="#f6a85f"/>
      <text x="43" y="30" fill="#f4f1e8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="650">Codex</text>
      <text x="22" y="58" fill="#8ea1ab" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Responses ↔ Chat</text>
    </g>

    <g transform="translate(220 224)">
      <rect width="196" height="80" rx="16" fill="#121c23" stroke="#30414c"/>
      <circle cx="24" cy="24" r="7" fill="#5ee6c4"/>
      <text x="43" y="30" fill="#f4f1e8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="650">OpenCode</text>
      <text x="22" y="58" fill="#8ea1ab" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">native providers</text>
    </g>
  </g>

  <g transform="translate(62 347)">
    <circle cx="6" cy="0" r="6" fill="#5ee6c4"/>
    <text x="20" y="6" fill="#8ea1ab" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">independent configs</text>
    <circle cx="220" cy="0" r="6" fill="#f6a85f"/>
    <text x="234" y="6" fill="#8ea1ab" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">local bridge when needed</text>
    <text x="1058" y="6" text-anchor="end" fill="#5d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">v0.2</text>
  </g>
</svg>
